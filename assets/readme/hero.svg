    <text x="0" y="-36" text-anchor="middle" font-size="34" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" fill="#F0E6D2">王</text>
    <text x="0" y="18" text-anchor="middle" font-size="22" font-weight="600" fill="#F0E6D2" font-family="Optima, Songti SC, STSong, Georgia, serif">点名</text>
    <path d="M-40 34 H40" stroke="#C9D4DF" stroke-opacity="0.55"/>
    <path d="M0 29 L5 34 L0 39 L-5 34 Z" fill="#C9D4DF"/>
    <text x="0" y="92" text-anchor="middle" font-size="18" letter-spacing="5" fill="#C9D4DF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">白银</text>
  </g>
  <g transform="translate(1074 208) rotate(9)">
    <path d="M-47.0,-103.0 H59.0 L75.0,-87.0 V107.0 L59.0,123.0 H-47.0 L-63.0,107.0 V-87.0 Z" fill="#000" opacity="0.45"/>
    <path d="M-53.0,-113.0 H53.0 L69.0,-97.0 V97.0 L53.0,113.0 H-53.0 L-69.0,97.0 V-97.0 Z" fill="url(#prism)"/>
    <path d="M-50.0,-106.0 H50.0 L62.0,-94.0 V94.0 L50.0,106.0 H-50.0 L-62.0,94.0 V-94.0 Z" fill="url(#panel)"/>
    <path d="M-50.0,-106.0 H50.0 L62.0,-94.0 V94.0 L50.0,106.0 H-50.0 L-62.0,94.0 V-94.0 Z" fill="none" stroke="#C69BFF" stroke-opacity="0.25"/>
    <circle cx="0" cy="-48" r="36" fill="#0B1A24" stroke="#C69BFF" stroke-opacity="0.6" stroke-width="2"/>
    <text x="0" y="-36" text-anchor="middle" font-size="38" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif">🍲</text>
    <text x="0" y="18" text-anchor="middle" font-size="22" font-weight="600" fill="#F0E6D2" font-family="Optima, Songti SC, STSong, Georgia, serif">火锅</text>
    <path d="M-40 34 H40" stroke="#C69BFF" stroke-opacity="0.55"/>
    <path d="M0 29 L5 34 L0 39 L-5 34 Z" fill="#C69BFF"/>
    <text x="0" y="92" text-anchor="middle" font-size="18" letter-spacing="5" fill="#C69BFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">棱彩</text>
  </g>
  <g transform="translate(940 192) rotate(0)">
    <path d="M-47.0,-103.0 H59.0 L75.0,-87.0 V107.0 L59.0,123.0 H-47.0 L-63.0,107.0 V-87.0 Z" fill="#000" opacity="0.45"/>
    <path d="M-53.0,-113.0 H53.0 L69.0,-97.0 V97.0 L53.0,113.0 H-53.0 L-69.0,97.0 V-97.0 Z" fill="url(#gold)"/>
    <path d="M-50.0,-106.0 H50.0 L62.0,-94.0 V94.0 L50.0,106.0 H-50.0 L-62.0,94.0 V-94.0 Z" fill="url(#panel)"/>
    <path d="M-50.0,-106.0 H50.0 L62.0,-94.0 V94.0 L50.0,106.0 H-50.0 L-62.0,94.0 V-94.0 Z" fill="none" stroke="#F2C45A" stroke-opacity="0.25"/>
    <circle cx="0" cy="-48" r="36" fill="#0B1A24" stroke="#F2C45A" stroke-opacity="0.6" stroke-width="2"/>
    <text x="0" y="-36" text-anchor="middle" font-size="28" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" fill="#F0E6D2">⌘H</text>
    <text x="0" y="18" text-anchor="middle" font-size="22" font-weight="600" fill="#F0E6D2" font-family="Optima, Songti SC, STSong, Georgia, serif">随时呼出</text>
    <path d="M-40 34 H40" stroke="#F2C45A" stroke-opacity="0.55"/>
    <path d="M0 29 L5 34 L0 39 L-5 34 Z" fill="#F2C45A"/>
    <text x="0" y="92" text-anchor="middle" font-size="18" letter-spacing="5" fill="#F2C45A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">黄金</text>
  </g>
</svg>
